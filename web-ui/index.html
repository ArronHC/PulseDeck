<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <meta name="description" content="All-in-one self-hosted server probe, uptime, and node observability deck." />
    <meta
      name="keywords"
      content="PulseDeck, server probe, Komari, uptime monitoring, Uptime Kuma, subscription map, IPPure, observability deck"
    />
    <meta name="author" content="PulseDeck" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const parseAppearance = (value) => {
          if (!value) return "light";
          try {
            const parsed = JSON.parse(value);
            return typeof parsed === "string" ? parsed : value;
          } catch {
            return value;
          }
        };

        try {
          const appearance = parseAppearance(localStorage.getItem("appearance"));
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          const isDark = appearance === "dark" || (appearance !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <style>
      :where(html) {
        background: #ffffff;
        color-scheme: light;
      }

      :where(html.dark) {
        background: #111111;
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }
    </style>
