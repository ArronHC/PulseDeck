name: Build frontend theme
description: Build the local web-ui default theme (or fallback to komari-web) and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build the frontend.
    default: "22"
  repository:
    description: Fallback komari-web repository URL when local web-ui is absent.
    default: https://github.com/komari-monitor/komari-web
  ref:
    description: Optional komari-web ref when cloning fallback repository.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Build and pack frontend
      shell: bash
      run: |
        set -euxo pipefail
        if [ -f web-ui/package.json ]; then
          FRONTEND_DIR="web-ui"
        else
          rm -rf komari-web
          if [ -n "${{ inputs.ref }}" ]; then
            git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" komari-web
          else
            git clone --depth=1 "${{ inputs.repository }}" komari-web
          fi
          FRONTEND_DIR="komari-web"
        fi

        (
          cd "$FRONTEND_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
        )

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f "$FRONTEND_DIR/dist/index.html"
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C "$FRONTEND_DIR/dist" .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-default-dist.tar"
        cp -f "$FRONTEND_DIR/komari-theme.json" web/public/defaultTheme/
        if [ -f "$FRONTEND_DIR/preview.png" ]; then cp -f "$FRONTEND_DIR/preview.png" web/public/defaultTheme/; fi
        if [ -f "$FRONTEND_DIR/perview.png" ]; then cp -f "$FRONTEND_DIR/perview.png" web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
