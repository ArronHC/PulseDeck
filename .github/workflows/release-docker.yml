name: Publish Docker Image Manually

on:
  workflow_dispatch:
    inputs:
      version:
        description: Docker image tag and embedded version.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: pulsedeck-frontend

  build-docker-binaries:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 1
          CGO_CFLAGS: -Os -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables
          GIN_MODE: release
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -buildid= -extldflags=-Wl,--gc-sections,--strip-all -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"

          echo "Building for linux/amd64..."
          GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -trimpath -tags "nomsgpack sqlite_omit_load_extension" -ldflags="$LDFLAGS" -o pulsedeck-linux-amd64

          echo "Building for linux/arm64..."
          GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -trimpath -tags "nomsgpack sqlite_omit_load_extension" -ldflags="$LDFLAGS" -o pulsedeck-linux-arm64

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: pulsedeck-docker-binaries
          path: pulsedeck-linux-*

  build-and-push-multi-arch:
    needs: build-docker-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          name: pulsedeck-docker-binaries
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Full)
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=${{ github.event.inputs.version }}-full

      - name: Build and push Full Docker image (with mihomo)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            INSTALL_PROXY_CORE=mihomo
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          no-cache: true
          provenance: false

      - name: Extract metadata (Lite)
        id: meta_lite
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}-lite

      - name: Build and push Lite Docker image (without proxy core)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            INSTALL_PROXY_CORE=none
          tags: ${{ steps.meta_lite.outputs.tags }}
          labels: ${{ steps.meta_lite.outputs.labels }}
          no-cache: true
          provenance: false
